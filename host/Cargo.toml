[package]
name = "host"
version = "0.1.0"
edition = "2024"

[dependencies]
tss-esapi = { version = "7.7.0", default-features = false }
blake2 = { version = "0.11.0", default-features = false }
rpassword = "7.5.4"
zeroize = "1.9.1"
chacha20 = { version = "0.10.2", default-features = false, features = [
  "cipher",
  "rng",
] }
x25519-dalek = { version = "3.0.0", default-features = false, features = [
  "zeroize",
] }
termios = "0.3.3"
getrandom = "0.4.3"
argon2 = "0.6.0"
nix = { version = "0.31.3", features = ["fs"] }
libc = "0.2.191"

[build-dependencies]
argon2 = "0.6.0"
